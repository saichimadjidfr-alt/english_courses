name: Daily English Course

on:
  schedule:
    - cron: "0 7 * * *"   # 9h à Paris (heure d'été)
    - cron: "0 8 * * *"   # 9h à Paris (heure d'hiver)
  workflow_dispatch:       # bouton pour lancer à la main

permissions:
  contents: write

concurrency:
  group: daily-course
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache du modèle d'embeddings
        uses: actions/cache@v4
        with:
          path: ~/.cache/chroma
          key: chroma-onnx-model

      - run: pip install -r requirements.txt

      - name: Générer et publier le cours
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python scripts/main.py

      - name: Sauvegarder la progression
        run: |
          git config user.name "course-bot"
          git config user.email "course-bot@users.noreply.github.com"
          git add data/state/progress.json
          git diff --staged --quiet || (git commit -m "Update progress" && git push)